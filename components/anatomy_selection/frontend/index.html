<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THEIA Anatomy Picker</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #06131d;
        color: #e2e8f0;
        font-family: Inter, "Segoe UI", sans-serif;
      }
      .viewer-shell {
        border: 1px solid rgba(125, 211, 252, 0.35);
        border-radius: 18px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 18px 46px rgba(15, 23, 42, 0.3);
      }
      iframe {
        display: block;
        width: 100%;
        height: 760px;
        border: 0;
        background: #000;
      }
      .status {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
        color: #a5f3fc;
        background: rgba(8, 47, 73, 0.4);
        border-top: 1px solid rgba(125, 211, 252, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="viewer-shell">
      <iframe id="viewer-frame" title="Anatomical viewer" src="http://localhost:3002/"></iframe>
      <div id="status" class="status">Waiting for anatomical selection…</div>
    </div>

    <script>
      // Streamlit component protocol, kept local (no CDN dependency).
      const Streamlit = {
        send(type, data = {}) { window.parent.postMessage({isStreamlitMessage: true, type, ...data}, '*'); },
        setComponentReady() { this.send('streamlit:componentReady', {apiVersion: 1}); },
        setFrameHeight(height) { this.send('streamlit:setFrameHeight', {height}); },
        setComponentValue(value) { this.send('streamlit:setComponentValue', {value, dataType: 'json'}); }
      };
      const VALID_ORIGIN = 'http://localhost:3002';
      const ALLOWED_TYPES = new Set(['THEIA_ORGAN_SELECTED']);

      function sanitizePayload(data) {
        if (!data || typeof data !== 'object') return null;

        if (data.action === 'selection-cleared') {
          return {
            identifier: '',
            organ: '',
            system: 'Musculoskeletal',
            action: 'selection-cleared',
            source: data.source || 'body-anatomy-3d-viewer',
            timestamp: data.timestamp || new Date().toISOString(),
          };
        }

        if (!data.organ || typeof data.organ !== 'string') return null;
        const organ = data.organ.trim();
        if (!organ || organ.length < 2) return null;

        const system = typeof data.system === 'string' && data.system.trim() ? data.system.trim() : 'Musculoskeletal';
        return {
          identifier: typeof data.identifier === 'string' ? data.identifier.trim() : organ,
          organ,
          system,
          action: 'select',
          source: data.source || 'body-anatomy-3d-viewer',
          timestamp: data.timestamp || new Date().toISOString(),
        };
      }

      function setStatus(message) {
        const element = document.getElementById('status');
        if (element) element.textContent = message;
      }

      window.addEventListener('message', function (event) {
        if (event.origin !== VALID_ORIGIN || event.source !== document.getElementById('viewer-frame').contentWindow) return;

        if (!event.data || !ALLOWED_TYPES.has(event.data.type)) return;

        const payload = sanitizePayload(event.data.payload);
        if (!payload) {
          setStatus('No valid structure selected.');
          return;
        }

        setStatus(`Selected: ${payload.organ} · ${payload.system}`);
        Streamlit.setComponentValue(payload);
      });

      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(820);
    </script>
  </body>
</html>
