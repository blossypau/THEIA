<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>THEIA Anatomy Picker</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        background: #06131d;
        color: #e2e8f0;
        font-family: Inter, "Segoe UI", sans-serif;
      }
      .viewer-shell {
        border: 1px solid rgba(125, 211, 252, 0.35);
        border-radius: 12px;
        overflow: hidden;
        background: rgba(15, 23, 42, 0.9);
        box-shadow: 0 18px 46px rgba(15, 23, 42, 0.3);
      }
      iframe {
        display: block;
        width: 100%;
        height: 680px;
        border: 0;
        background: #000;
      }
      .status {
        padding: 0.6rem 0.8rem;
        font-size: 0.8rem;
        color: #a5f3fc;
        background: rgba(8, 47, 73, 0.4);
        border-top: 1px solid rgba(125, 211, 252, 0.25);
      }
    </style>
  </head>
  <body>
    <div class="viewer-shell">
      <iframe id="viewer-frame" title="Anatomical viewer" src="http://127.0.0.1:3004/"></iframe>
      <div id="status" class="status">Waiting for anatomical selection…</div>
    </div>

    <script>
      // Streamlit component protocol, kept local (no CDN dependency).
      const Streamlit = {
        send(type, data = {}) { window.parent.postMessage({isStreamlitMessage: true, type, ...data}, '*'); },
        setComponentReady() { this.send('streamlit:componentReady', {apiVersion: 1}); },
        setFrameHeight(height) { this.send('streamlit:setFrameHeight', {height}); },
        setComponentValue(value) { this.send('streamlit:setComponentValue', {value, dataType: 'json'}); }
      };
      let VALID_ORIGIN = 'http://127.0.0.1:3004';
      const ALLOWED_TYPES = new Set(['THEIA_ORGAN_SELECTED']);

      function sanitizePayload(data) {
        if (!data || typeof data !== 'object') return null;

        if (data.action === 'selection-cleared') {
          return {
            identifier: '',
            organ: '',
            system: 'Musculoskeletal',
            action: 'selection-cleared',
            source: data.source || 'body-anatomy-3d-viewer',
            timestamp: data.timestamp || new Date().toISOString(),
          };
        }

        if (!data.organ || typeof data.organ !== 'string') return null;
        const organ = data.organ.trim();
        if (!organ || organ.length < 2) return null;

        const system = typeof data.system === 'string' && data.system.trim() ? data.system.trim() : 'Musculoskeletal';
        return {
          identifier: typeof data.identifier === 'string' ? data.identifier.trim() : organ,
          organ,
          system,
          action: 'select',
          source: data.source || 'body-anatomy-3d-viewer',
          timestamp: data.timestamp || new Date().toISOString(),
        };
      }

      function setStatus(message) {
        const element = document.getElementById('status');
        if (element) element.textContent = message;
      }

      let lastCommand = '';
      let pendingCommand = null;
      function sendViewerCommand() {
        if (pendingCommand) { document.getElementById('viewer-frame').contentWindow.postMessage({type:'THEIA_VIEWER_COMMAND',payload:pendingCommand}, VALID_ORIGIN); setStatus(pendingCommand.identifier ? `Selected via controls: ${pendingCommand.identifier}` : 'Select an anatomical structure.'); }
      }
      document.getElementById('viewer-frame').addEventListener('load',sendViewerCommand);
      window.addEventListener('message', function (event) {
        if (event.source === window.parent && event.data?.type === 'streamlit:render') {
          const requested = event.data.args?.viewer_url;
          if (requested) {
            const url = new URL(requested);
            if (url.protocol === 'http:' && ['localhost','127.0.0.1'].includes(url.hostname)) {
              VALID_ORIGIN = url.origin;
              const frame = document.getElementById('viewer-frame');
              if (frame.src !== url.href) frame.src = url.href;
            }
          }
          const command = {identifier:event.data.args?.selected_identifier || null, identifiers:event.data.args?.visible_identifiers || null, revision:event.data.args?.command_revision || 0};
          const encoded = JSON.stringify({identifiers:command.identifiers, revision:command.revision});
          pendingCommand=command;
          if (encoded !== lastCommand) { lastCommand=encoded; sendViewerCommand(); }
          return;
        }
        if (event.origin !== VALID_ORIGIN || event.source !== document.getElementById('viewer-frame').contentWindow) return;

        if (!event.data || !ALLOWED_TYPES.has(event.data.type)) return;

        const payload = sanitizePayload(event.data.payload);
        if (!payload) {
          setStatus('No valid structure selected.');
          return;
        }

        setStatus(`Selected: ${payload.organ} · ${payload.system}`);
        Streamlit.setComponentValue(payload);
      });

      Streamlit.setComponentReady();
      Streamlit.setFrameHeight(720);
    </script>
  </body>
</html>
